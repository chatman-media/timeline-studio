[package]
name = "ts-render-tauri"
version = "0.1.0"
edition = "2021"
description = "Тонкий Tauri-командный слой Timeline Studio (#91/#92, Option B). Несёт #[tauri::command]-обёртки (группа workflow + будущие волны), поэтому зависит от tauri. Tauri-free фундамент (VideoCompilerState/ServiceContainer/services/ffmpeg_command) вынесен в ts-render-services и реэкспортируется оттуда."

[lib]
name = "ts_render_tauri"
path = "src/lib.rs"

[dependencies]
# tauri нужен для #[tauri::command]; версия и фичи держатся в синхроне с src-tauri/Cargo.toml.
tauri = { version = "2.9", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# info-группа (Wave 2): сбор системной информации (диски/CPU/ОС) для get_system_info/get_disk_space.
sysinfo = "0.37.2"
num_cpus = "1.17"
os_info = "3.12.0"
# preview_advanced-группа (Wave 2): base64-декод превью-кадров + uuid для id генератора.
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# batch-группа (Wave 2): once_cell::sync::Lazy для глобального реестра batch-задач.
once_cell = "1"
# monitoring-группа (Wave 2): chrono::DateTime<Utc> в типах метрик/снапшотов; log в business_logic.
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
# monitoring-группа (Wave 2): tokio::runtime::Handle / task::block_in_place в командах метрик.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Tauri-free фундамент (Wave 1): VideoCompilerState + ServiceContainer + services/* +
# ffmpeg_command/ переехали сюда; этот крейт их реэкспортирует.
ts-render-services = { path = "../ts-render-services" }
# Движок рендера (#90): перенесённые группы команд (Wave 2+) ссылаются на
# core::{gpu,error,...} и CompilerSettings напрямую из ts-render.
ts-render = { path = "../ts-render" }

[dev-dependencies]
# Используется в тестах группы workflow.
tempfile = "3"
# tokio (rt-multi-thread + macros) для #[tokio::test] объявлен в [dependencies].
