[package]
name = "ts-render-tauri"
version = "0.1.0"
edition = "2021"
description = "Тонкий Tauri-командный слой Timeline Studio (#91/#92, Option B). Несёт #[tauri::command]-обёртки (группа workflow + будущие волны), поэтому зависит от tauri. Tauri-free фундамент (VideoCompilerState/ServiceContainer/services/ffmpeg_command) вынесен в ts-render-services и реэкспортируется оттуда."

[lib]
name = "ts_render_tauri"
path = "src/lib.rs"

[dependencies]
# tauri нужен для #[tauri::command]; версия и фичи держатся в синхроне с src-tauri/Cargo.toml.
tauri = { version = "2.9", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# info-группа (Wave 2): сбор системной информации (диски/CPU/ОС) для get_system_info/get_disk_space.
sysinfo = "0.37.2"
num_cpus = "1.17"
os_info = "3.12.0"
# preview_advanced-группа (Wave 2): base64-декод превью-кадров + uuid для id генератора.
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# batch-группа (Wave 2): once_cell::sync::Lazy для глобального реестра batch-задач.
once_cell = "1"
# whisper_commands-группа (Wave 2): OpenAI Whisper API (multipart upload + json ответ),
# which (поиск локального whisper в PATH), dirs (каталог моделей).
reqwest = { version = "0.12", features = ["json", "multipart"] }
which = "8.0.0"
dirs = "6.0.0"
# monitoring-группа (Wave 2): chrono::DateTime<Utc> в типах метрик/снапшотов; log в business_logic.
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
# monitoring-группа (Wave 2): tokio::runtime::Handle / task::block_in_place в командах метрик.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Tauri-free фундамент (Wave 1): VideoCompilerState + ServiceContainer + services/* +
# ffmpeg_command/ переехали сюда; этот крейт их реэкспортирует.
ts-render-services = { path = "../ts-render-services" }
# Движок рендера (#90): перенесённые группы команд (Wave 2+) ссылаются на
# core::{gpu,error,...} и CompilerSettings напрямую из ts-render.
ts-render = { path = "../ts-render" }
# Движок распознавания (#96): группа recognition_advanced_commands использует
# model_manager::YoloModel (enum). Корректное направление зависимости command->engine.
ts-recognition = { path = "../ts-recognition" }
# ai_api_proxy (#91): события (AppEvent) + защищённое хранилище API-ключей.
ts-events = { path = "../ts-events" }
ts-secure-storage = { path = "../ts-secure-storage" }
# platform_optimization (#91): UnifiedAnalysisResult из ts-analysis (command->engine);
# типы/логику платформо-оптимизации тянет из ts-platform (дедуп #121).
ts-analysis = { path = "../ts-analysis" }
ts-platform = { path = "../ts-platform" }
# video_analysis (#91): ffmpeg-анализ (scene/motion/quality/...) + типы результатов.
ts-render-analysis = { path = "../ts-render-analysis" }
# ai_api_proxy внешние: HTTP, rate-limit, кэш(sqlite), хэш, ретраи, specta-типы.
anyhow = "1.0"
futures = "0.3"
governor = "0.10.4"
nonzero_ext = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "vtab", "load_extension"] }
sha2 = "0.10"
tokio-retry = "0.3"
specta = { version = "2.0.0-rc.21", features = ["derive", "function", "serde", "chrono", "uuid", "serde_json"] }

[dev-dependencies]
# Используется в тестах группы workflow.
tempfile = "3"
# tokio (rt-multi-thread + macros) для #[tokio::test] объявлен в [dependencies].
