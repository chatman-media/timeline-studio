[package]
name = "ts-render-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri-командный слой Timeline Studio поверх ts-render (#91/#92, Option B). Вынос video_compiler::commands/services/state из монолита src-tauri в крейт. Содержит #[tauri::command]-обёртки, поэтому зависит от tauri (в отличие от headless ts-render)."

[lib]
name = "ts_render_tauri"
path = "src/lib.rs"

[dependencies]
# tauri нужен для #[tauri::command]; версия и фичи держатся в синхроне с src-tauri/Cargo.toml.
tauri = { version = "2.9", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Движок рендера (#90): services/state ре-используют core::{cache,gpu,preview,renderer,
# pipeline_refactored,progress,error,ffmpeg_builder,ffmpeg_executor} и CompilerSettings.
ts-render = { path = "../ts-render" }
# Схема проекта (#93): core::schema == ts_schema (timeline/Clip/Track/ProjectSchema/...).
ts-schema = { path = "../ts-schema" }

# Рантайм-зависимости перенесённого слоя services/state (синхронны с src-tauri/Cargo.toml).
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
# Используются только в перенесённых тестах: futures::future::join_all (state.rs),
# filetime (cache_service.rs — выставление mtime для теста вытеснения кэша).
futures = "0.3"
filetime = "0.2"
