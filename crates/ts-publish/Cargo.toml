[package]
name = "ts-publish"
version = "0.1.0"
edition = "2021"
description = "Публикация видео на платформы (Telegram Bot API, YouTube) — M5 #124"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
