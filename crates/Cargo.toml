# Workspace для вынесенных крейтов Timeline Studio (#92).
# src-tauri (монолит) — отдельный workspace; его фолдинг сюда отложен до тех пор,
# пока монолит не распилен достаточно, чтобы собираться (см. эпик #91).
[workspace]
resolver = "2"
members = [
  "ts-core-types",
  "ts-state",
  "ts-cli",
  "ts-agent",
  "ts-platform", "ts-publish",
  "ts-events", "ts-schema", "ts-render", "ts-render-services", "ts-render-tauri", "ts-recognition", "ts-subtitles", "ts-media", "ts-montage", "ts-analysis"]
