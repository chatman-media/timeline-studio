[package]
name = "ts-media"
version = "0.1.0"
edition = "2021"
description = "Медиа Timeline Studio (метаданные/превью/сканирование, ffmpeg-CLI). Без Tauri (#95)."

[lib]
name = "ts_media"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3"
image = "0.25"
