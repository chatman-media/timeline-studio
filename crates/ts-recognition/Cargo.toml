[package]
name = "ts-recognition"
version = "0.1.0"
edition = "2021"
description = "ONNX-инференс Timeline Studio (YOLO/FaceNet/RetinaFace/MediaPipe + кластеризация лиц). Изолирует ort/ONNX, ndarray, image (#96). Без Tauri/analysis."

[lib]
name = "ts_recognition"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3"
# Тяжёлые/нативные — изолированы здесь:
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.17"
image = "0.25"
imageproc = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
