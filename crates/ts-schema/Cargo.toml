[package]
name = "ts-schema"
version = "0.1.0"
edition = "2021"
description = "Доменная модель проекта Timeline Studio (ProjectSchema/Timeline/Clip/...). Фундамент-крейт: только serde, без Tauri/ffmpeg/ort. Эпик #91 / задача #93."

[lib]
name = "ts_schema"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "2.0.0-rc.21", features = ["derive"] }
