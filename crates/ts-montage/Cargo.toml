[package]
name = "ts-montage"
version = "0.1.0"
edition = "2021"
description = "AI-планировщик монтажа Timeline Studio (moment/quality/activity/emotion + plan_generator). Без Tauri (#98)."

[lib]
name = "ts_montage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "2.0.0-rc.21", features = ["derive"] }
ts-schema = { path = "../ts-schema" }
