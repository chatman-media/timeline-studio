[package]
name = "ts-subtitles"
version = "0.1.0"
edition = "2021"
description = "Субтитры Timeline Studio (генерация/парсинг/синхронизация). Лист-крейт, без Tauri (#99)."

[lib]
name = "ts_subtitles"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
