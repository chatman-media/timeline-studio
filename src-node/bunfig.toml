[install]
# Bun package manager settings
optional = true
dev = true
peer = true

[run]
# Preload tsconfig paths
preload = []

# Path aliases matching tsconfig.json
[module]
paths = {
  "@/*" = ["../src/*"],
  "@domains/*" = ["../src/domains/*"],
  "@core/*" = ["../src/core/*"],
  "@adapters/*" = ["../src/adapters/*"],
  "@node/*" = ["./src/*"]
}

[test]
# Test configuration
preload = ["__tests__/setup.ts"]
coverage = true
coverageDir = "coverage"
coverageReporter = ["text", "lcov", "html"]

# Only run files matching these patterns
testMatch = ["**/__tests__/**/*.test.ts"]

# Timeout for tests (in milliseconds)
timeout = 10000
