name: Docker headless

# Собирает и публикует ghcr.io/chatman-media/timeline-headless — M2 #121.
# Запускается при push в main (если затронуты crates/ или Dockerfile)
# или вручную (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'docker/Dockerfile.headless'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      skip_models:
        description: 'Skip ONNX model download (offline build)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chatman-media/timeline-headless

jobs:
  build-and-push:
    name: Build & push timeline-headless
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.headless
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SKIP_MODELS=${{ github.event.inputs.skip_models || 'false' }}
