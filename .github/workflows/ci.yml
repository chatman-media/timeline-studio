name: CI - Tests and Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:

# Отменять предыдущие запуски при новом push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Free disk space
        run: |
          # Агрессивное освобождение места (~25GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package-lock.json', 'package.json', 'packages/*/package.json', 'apps/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          export ONNXRUNTIME_DOWNLOAD_TIMEOUT=600000
          bun install --frozen-lockfile || bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: Set environment
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Create dist directory
        run: mkdir -p dist

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false
          cache-all-crates: false
          shared-key: ci-build
          # Не сохранять кэш, только восстанавливать (экономит место)
          save-if: false

      - name: Build Rust dependencies
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
          FFMPEG_SYS_DISABLE_X86ASM: "1"
          CARGO_FEATURE_FFMPEG_SYS_DISABLE_X86ASM: "1"
        run: |
          cd src-tauri
          cargo build --release

      - name: Clean build artifacts
        run: |
          cd src-tauri
          # Удаляем большие временные файлы и debug артефакты
          rm -rf target/release/build/*/out
          rm -rf target/release/build/*/output
          rm -rf target/release/incremental
          rm -rf target/release/deps/*.so
          rm -rf target/release/deps/*.dylib
          # Оставляем только скомпилированные библиотеки зависимостей
          find target/release -type f -name "*.rlib" -delete
          find target/release -maxdepth 1 -type f ! -name "generate_types*" -delete

      - name: Generate TypeScript bindings
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
          FFMPEG_SYS_DISABLE_X86ASM: "1"
          CARGO_FEATURE_FFMPEG_SYS_DISABLE_X86ASM: "1"
        run: |
          cd src-tauri
          cargo run --bin generate_types

      - name: Run frontend tests
        run: bun run test
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  rust-tests:
    name: Rust Tests
    if: false # temporarily disabled
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          # Агрессивное освобождение места (~25GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force
          # Очистка apt кэша
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false
          cache-all-crates: false
          shared-key: ci-test
          # Не сохранять кэш, только восстанавливать (экономит место)
          save-if: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: Setup FFmpeg environment
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Rust tests
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
          CARGO_BUILD_JOBS: 2
        run: |
          cd src-tauri
          # Skip recognition tests - they require ONNX Runtime which is not available in CI
          if [ -f ./run-tests.sh ]; then
            ./run-tests.sh --lib --bins --tests -- --test-threads=2 --skip recognition::
          else
            cargo test --lib --bins --tests -- --test-threads=2 --skip recognition::
          fi

      - name: Clean test artifacts
        run: |
          cd src-tauri
          # Удаляем временные тестовые артефакты
          rm -rf target/debug/incremental
          rm -rf target/debug/build/*/out
          rm -rf target/debug/build/*/output
          # Удаляем большие бинарники тестов
          find target/debug/deps -type f -executable -delete
          find target/debug -maxdepth 1 -type f -executable -delete

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-lint-${{ hashFiles('bun.lock', 'package-lock.json', 'package.json', 'packages/*/package.json', 'apps/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-lint-

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run linting
        run: bun run lint:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-typecheck-${{ hashFiles('bun.lock', 'package-lock.json', 'package.json', 'packages/*/package.json', 'apps/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install promo dependencies
        run: |
          cd promo
          bun install --frozen-lockfile || bun install
          cd ..

      - name: Run type check
        # src/types/generated/tauri-bindings.ts is committed to the repo,
        # so no Rust build or Linux system deps are needed here.
        run: bun run check:type

      - name: Run workspace type checks
        run: bun run check:workspaces

      - name: Run package boundary baseline gate
        run: bun run check:boundaries:baseline
