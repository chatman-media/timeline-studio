[package]
name = "timeline-studio"
version = "3.111.1"
description = "A Timeline Studio"
authors = ["Alexander Kireyev <ak.chatman.media@gmail.com>"]
license = "MIT WITH Commons-Clause"
repository = "https://github.com/chatman-media/timeline-studio"
edition = "2021"
default-run = "timeline-studio"
# Disable auto-detection of binaries in src/bin/
# This prevents development-only binaries (generate_types, export_types) from being included in release builds
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timeline_studio_lib"
# staticlib removed: caused link-ICE (rustc_codegen_ssa/back/link.rs unwrap NotFound)
# when building standalone [[bin]] targets on desktop. staticlib only needed for
# iOS/Android native builds — re-add per-platform via build.rs if needed. (#103)
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "timeline-studio"
path = "src/main.rs"

# Commented out for release builds - uncomment for development type generation
# [[bin]]
# name = "test_specta"
# path = "src/bin/test_specta.rs"

[[bin]]
name = "generate_types"
path = "src/bin/generate_types.rs"

# Commented out for release builds - development tool only
# [[bin]]
# name = "export_types"
# path = "src/bin/export_types.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
ffmpeg-sys-next = "8.0.1"

[dev-dependencies]
# For test cleanup and initialization
ctor = "0.6.3"
env_logger = "0.11"
libc = "0.2"
# Test utilities
tempfile = "3.23"
tower = { version = "0.5.3", features = ["util"] }
urlencoding = "2.1"
mockito = "1.7"
# Benchmarking
criterion = { version = "0.8.1", features = ["html_reports"] }
# HTTP mocking for OAuth tests
httpmock = "0.8.2"
# Mocking framework for tests
mockall = "0.14.0"
# Async utilities for testing
futures = "0.3"
rand_chacha = "0.9.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9", features = [ "protocol-asset", "devtools"] }
tauri-plugin-opener = "2.5"
sys-locale = "0.3"
tauri-plugin-websocket = "2.4"
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-log = "2.8"
tauri-plugin-store = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-updater = "2.9"
# Database dependencies
tauri-plugin-sql = { version = "2.3", features = ["sqlite"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab", "load_extension"] }
# Video Compiler dependencies
ts-schema = { path = "../crates/ts-schema" }
# Headless crates (#91 decomp) — slim host wires these in (#102)
ts-core-types = { path = "../crates/ts-core-types" }
ts-state = { path = "../crates/ts-state", features = ["specta"] }
ts-agent = { path = "../crates/ts-agent" }
ts-platform = { path = "../crates/ts-platform" }
ts-analysis = { path = "../crates/ts-analysis" }
ts-analysis-tauri = { path = "../crates/ts-analysis-tauri" }
ts-mcp = { path = "../crates/ts-mcp" }
ts-events = { path = "../crates/ts-events" }
ts-secure-storage = { path = "../crates/ts-secure-storage" }
ts-security = { path = "../crates/ts-security" }
ts-render = { path = "../crates/ts-render" }
ts-render-services = { path = "../crates/ts-render-services" }
ts-render-analysis = { path = "../crates/ts-render-analysis" }
ts-state-tauri = { path = "../crates/ts-state-tauri" }
ts-core = { path = "../crates/ts-core" }
ts-command-registry = { path = "../crates/ts-command-registry" }
ts-render-tauri = { path = "../crates/ts-render-tauri" }
ts-montage = { path = "../crates/ts-montage" }
ts-subtitles = { path = "../crates/ts-subtitles" }
ts-recognition = { path = "../crates/ts-recognition" }
ts-recognition-tauri = { path = "../crates/ts-recognition-tauri" }
ts-media = { path = "../crates/ts-media" }
ts-media-tauri = { path = "../crates/ts-media-tauri" }
ffmpeg-next = "8"
uuid = { version = "1.18", features = ["serde", "v4"] }
tokio = { version = "1.49", features = ["full"] }
tokio-metrics = "0.4.5"
futures = "0.3"
dashmap = "6.1"
image = "0.25"
imageproc = "0.26"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1.12"
# Safer mutex implementation that avoids destructor issues
parking_lot = "0.12"
async-trait = "0.1"
base64 = "0.22"
once_cell = "1.21"
# Video Server dependencies
axum = { version = "0.8", features = ["tokio", "http2"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
md5 = "0.8.0"
dirs = "6.0.0"
anyhow = "1.0"
# pyo3 removed: declared but unused in all .rs files (#103)
# Will be re-added to a dedicated ts-whisper crate when Faster Whisper integration lands
# Security and API keys management
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
keyring = "3.6"
# HTTP client for API validation
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
which = "8.0.0"
# Retry logic with exponential backoff
tokio-retry = "0.3"
# Rate limiting
governor = "0.10.4"
nonzero_ext = "0.3"
# URL handling for OAuth
url = "2.5"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.17"
# System information dependencies
num_cpus = "1.17"
sysinfo = "0.37.2"
os_info = "3.12.0"
# OpenTelemetry dependencies (pinned to compatible older versions)
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = ["tonic", "metrics", "trace"] }
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry-prometheus = "0.31.0"
tracing = "0.1"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.14.2"
# wasmtime/wasmtime-wasi removed: declared but unused in all .rs files (#103)
# Will be re-added to ts-plugins crate when WASM plugin sandbox lands
filetime = "0.2"
wasm-bindgen = "0.2"
# Additional security dependencies
cap-std = "4.0.0"
sha2 = "0.10"
prometheus = "0.14"
# Type generation
specta = { version = "2.0.0-rc.21", features = ["serde", "chrono", "uuid", "serde_json"] }
specta-typescript = { version = "0.0.9" }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
# Compression
zstd = "0.13"
# Audio processing
symphonia = { version = "0.5.5", features = ["all"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
# Optimization for binary size
opt-level = "z"     # Optimize for size
lto = "thin"        # Enable Link Time Optimization (thin mode for faster builds)
codegen-units = 1   # Better optimization (slower build but smaller binaries)
strip = true        # Strip symbols from binary
panic = "abort"     # Reduce binary size by removing unwinding code

[profile.dev]
# Faster development builds
opt-level = 0
debug = true
incremental = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Merged with the earlier dev-dependencies section

[package.metadata.bundle]
name = "Timeline Studio"
identifier = "com.chatman-media.timeline-studio"

[package.metadata.tauri]
# Info.plist customizations for macOS
macos_info_plist_additions = """
<key>NSCameraUsageDescription</key>
<string>Timeline Studio needs access to your camera to record video</string>
<key>NSMicrophoneUsageDescription</key>
<string>Timeline Studio needs access to your microphone to record audio</string>
<key>NSPhotoLibraryUsageDescription</key>
<string>Timeline Studio needs access to your photo library to import media</string>
<key>NSPhotoLibraryAddUsageDescription</key>
<string>Timeline Studio needs permission to save videos to your photo library</string>
"""

# Benchmarks commented out temporarily to fix compilation warnings
# [[bench]]
# name = "ffmpeg_benchmarks"
# harness = false
# path = "src/video_compiler/benchmarks/ffmpeg_benchmarks.rs"

[workspace]
resolver = "2"
