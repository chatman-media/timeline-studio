[package]
name = "timeline-studio"
version = "2.8.0"
description = "A Timeline Studio"
authors = ["Alexander Kireyev <ak.chatman.media@gmail.com>"]
license = "MIT WITH Commons-Clause"
repository = "https://github.com/chatman-media/timeline-studio"
edition = "2021"
default-run = "timeline-studio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timeline_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "timeline-studio"
path = "src/main.rs"

# Commented out for release builds - uncomment for development type generation
# [[bin]]
# name = "test_specta"
# path = "src/bin/test_specta.rs"

# [[bin]]
# name = "generate_types"
# path = "src/bin/generate_types.rs"

[[bin]]
name = "export_types"
path = "src/bin/export_types.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
ffmpeg-sys-next = "8.0.1"

[dev-dependencies]
# For test cleanup and initialization
ctor = "0.6.1"
env_logger = "0.11"
libc = "0.2"
# Test utilities
tempfile = "3.23"
tower = { version = "0.5.2", features = ["util"] }
urlencoding = "2.1"
reqwest = { version = "0.12.24", features = ["json"] }
mockito = "1.7"
# Benchmarking
criterion = { version = "0.7.0", features = ["html_reports"] }
# HTTP mocking for OAuth tests
httpmock = "0.8.2"
# Mocking framework for tests
mockall = "0.13.1"
# Async utilities for testing
futures = "0.3"
rand_chacha = "0.9.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9", features = [ "protocol-asset", "devtools"] }
tauri-plugin-opener = "2.5"
sys-locale = "0.3"
tauri-plugin-websocket = "2.4"
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-log = "2.7"
tauri-plugin-store = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-updater = "2.9"
# Database dependencies
tauri-plugin-sql = { version = "2.3", features = ["sqlite"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab", "load_extension"] }
# Video Compiler dependencies
ffmpeg-next = "8"
uuid = { version = "1.18", features = ["serde", "v4"] }
tokio = { version = "1.48", features = ["full"] }
tokio-metrics = "0.4.5"
futures = "0.3"
dashmap = "6.1"
image = "0.25"
imageproc = "0.25"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1.12"
# Safer mutex implementation that avoids destructor issues
parking_lot = "0.12"
async-trait = "0.1"
base64 = "0.22"
once_cell = "1.21"
# Video Server dependencies
axum = { version = "0.8", features = ["tokio", "http2"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
md5 = "0.8.0"
dirs = "6.0.0"
anyhow = "1.0"
# Python interop for Faster Whisper
pyo3 = { version = "0.27.1", features = ["auto-initialize"] }
# Security and API keys management
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
keyring = "3.6"
# HTTP client for API validation
reqwest = { version = "0.12.23", features = ["json", "rustls-tls", "multipart"] }
which = "8.0.0"
# URL handling for OAuth
url = "2.5"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.17"
# System information dependencies
num_cpus = "1.17"
sysinfo = "0.37.2"
os_info = "3.12.0"
# OpenTelemetry dependencies (pinned to compatible older versions)
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = ["tonic", "metrics", "trace"] }
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry-prometheus = "0.29.1"
tracing = "0.1"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.14.2"
# WebAssembly runtime dependencies
wasmtime = { version = "38.0", default-features = false }
filetime = "0.2"
wasmtime-wasi = "38.0"
wasm-bindgen = "0.2"
# Additional security dependencies
cap-std = "3.4"
sha2 = "0.10"
prometheus = "0.14"
# Type generation
specta = { version = "2.0.0-rc.21", features = ["serde", "chrono", "uuid", "serde_json"] }
specta-typescript = { version = "0.0.9" }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
# Compression
zstd = "0.13"
# Audio processing
symphonia = { version = "0.5.5", features = ["all"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
custom-protocol = [ "tauri/custom-protocol" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Merged with the earlier dev-dependencies section

[package.metadata.bundle]
name = "Timeline Studio"
identifier = "com.chatman-media.timeline-studio"

[package.metadata.tauri]
# Info.plist customizations for macOS
macos_info_plist_additions = """
<key>NSCameraUsageDescription</key>
<string>Timeline Studio needs access to your camera to record video</string>
<key>NSMicrophoneUsageDescription</key>
<string>Timeline Studio needs access to your microphone to record audio</string>
<key>NSPhotoLibraryUsageDescription</key>
<string>Timeline Studio needs access to your photo library to import media</string>
<key>NSPhotoLibraryAddUsageDescription</key>
<string>Timeline Studio needs permission to save videos to your photo library</string>
"""

# Benchmarks commented out temporarily to fix compilation warnings
# [[bench]]
# name = "ffmpeg_benchmarks"
# harness = false
# path = "src/video_compiler/benchmarks/ffmpeg_benchmarks.rs"

[workspace]
resolver = "2"
